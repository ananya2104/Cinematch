<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineMatch — what should I watch?</title>
<link rel="stylesheet" href="static/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23d9a441%22/><polygon points=%2240,32 68,50 40,68%22 fill=%22%23141519%22/></svg>">
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">▶</span>
      <span class="brand-name">CineMatch</span>
    </div>
    <div class="lang-picker" id="langPicker">
      <button type="button" class="lang-chip active" data-code="auto">Auto</button>
      <button type="button" class="lang-chip" data-code="en">English</button>
      <button type="button" class="lang-chip" data-code="hi">हिंदी</button>
      <button type="button" class="lang-chip" data-code="es">Español</button>
      <button type="button" class="lang-chip" data-code="ta">தமிழ்</button>
      <button type="button" class="lang-chip" data-code="bn">বাংলা</button>
      <button type="button" class="lang-chip" data-code="fr">Français</button>
    </div>
    <button type="button" class="reset-btn" id="resetBtn" title="Start a new conversation">New chat</button>
  </header>

  <main class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">▶</div>
      <h1 id="emptyHeading">What do you want<br>to watch today?</h1>
      <p id="emptySubtitle">A favourite actor or director, a certain era, the occasion, or just genre and mood — pick a starting point, or tell me whatever's on your mind.</p>
      <div class="chip-row" id="welcomeChips">
        <button type="button" class="chip">Genre or mood</button>
        <button type="button" class="chip">Actor, director, or franchise</button>
        <button type="button" class="chip">Release era</button>
        <button type="button" class="chip">Occasion or company</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
  </main>

  <footer class="composer">
    <div class="quick-replies" id="quickReplies"></div>
    <form class="input-row" id="composerForm" autocomplete="off">
      <input type="text" id="messageInput" placeholder="Ask me anything, in any language…" maxlength="500">
      <button type="submit" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 11.5L21 3l-8.5 18-2.5-7.5L3 11.5z" fill="currentColor"/></svg>
      </button>
    </form>
  </footer>

</div>

<template id="tpl-message-user">
  <div class="msg msg-user"><div class="bubble"></div></div>
</template>

<template id="tpl-message-assistant">
  <div class="msg msg-assistant">
    <div class="avatar">▶</div>
    <div class="assistant-content"><div class="text"></div></div>
  </div>
</template>

<template id="tpl-typing">
  <div class="msg msg-assistant msg-typing">
    <div class="avatar">▶</div>
    <div class="typing-dots"><span></span><span></span><span></span></div>
  </div>
</template>

<template id="tpl-platform-widget">
  <div class="widget platform-widget">
    <h3>What do you have access to?</h3>
    <p class="widget-sub">Tick your subscriptions so every pick is actually watchable — or skip to see anything.</p>
    <div class="platform-grid"></div>
    <div class="widget-actions">
      <button type="button" class="skip-btn">Skip — show me anything</button>
      <button type="button" class="continue-btn">Continue</button>
    </div>
  </div>
</template>

<template id="tpl-platform-item">
  <label class="platform-item">
    <span class="dot"></span>
    <span class="platform-name"></span>
    <input type="checkbox">
    <span class="check-mark"></span>
  </label>
</template>

<template id="tpl-recs">
  <div class="rec-grid"></div>
</template>

<template id="tpl-rec-card">
  <div class="rec-card">
    <div class="rec-poster">
      <img alt="" loading="lazy">
      <span class="rec-platform-badge"></span>
      <span class="rec-rating"></span>
    </div>
    <div class="rec-body">
      <div class="rec-title-row">
        <span class="rec-title"></span>
        <span class="rec-year"></span>
      </div>
      <p class="rec-blurb"></p>
      <a class="watch-btn" target="_blank" rel="noopener noreferrer">Watch now</a>
    </div>
  </div>
</template>

<script>
  // This page is hosted separately from the backend (GitHub Pages), so it needs
  // the backend's absolute URL — same app.js file otherwise, no other changes.
  window.__API_BASE__ = "https://cinematch-hb-api.azurewebsites.net";
</script>
<script src="static/js/app.js"></script>
</body>
</html>
